# GitHub Actions release workflow — auto-detects Node/Electron or .NET projects.
# Triggered automatically when App Publisher creates a GitHub Release.
name: Release Desktop App

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      # Detect project type and run the appropriate build.
      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            echo "project-type=node" >> $GITHUB_OUTPUT
          elif ls *.csproj 1>/dev/null 2>&1; then
            echo "project-type=dotnet" >> $GITHUB_OUTPUT
          elif ls *.sln 1>/dev/null 2>&1; then
            echo "project-type=dotnet" >> $GITHUB_OUTPUT
          else
            echo "project-type=unknown" >> $GITHUB_OUTPUT
          fi

      # --- Node / Electron build ---
      - name: Set up Node.js
        if: steps.detect.outputs.project-type == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.project-type == 'node'
        run: npm ci

      - name: Build Electron app
        if: steps.detect.outputs.project-type == 'node'
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows installer (electron-builder)
        if: steps.detect.outputs.project-type == 'node'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- .NET / WPF build ---
      # NOTE: App Publisher (publish-consumer.ps1) is the source of truth for
      # KalOS releases — it builds dist/KalOS.zip and attaches it to the
      # GitHub Release. The duplicate publish/zip/upload steps that created
      # app-release.zip have been removed to avoid duplicate assets.
      - name: Set up .NET (validation only — no artifact upload)
        if: steps.detect.outputs.project-type == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Restore .NET dependencies
        if: steps.detect.outputs.project-type == 'dotnet'
        run: dotnet restore

      - name: Build .NET project
        if: steps.detect.outputs.project-type == 'dotnet'
        run: dotnet build --configuration Release --no-restore

      - name: Notify Discord about release
        if: success() && env.DISCORD_RELEASE_WEBHOOK != ''
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          $title = $env:RELEASE_NAME
          if ([string]::IsNullOrWhiteSpace($title)) { $title = "KalOS $env:RELEASE_TAG" }
          $payload = @{
            username = "KalOS Releases"
            embeds = @(
              @{
                title = $title
                url = $env:RELEASE_URL
                description = "A new KalOS release is available."
                color = 7275225
                fields = @(
                  @{
                    name = "Version"
                    value = $env:RELEASE_TAG
                    inline = $true
                  }
                )
              }
            )
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType "application/json" -Body $payload
